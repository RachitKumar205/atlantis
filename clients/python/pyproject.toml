[build-system]
# 1.27 is the first release that reads a PEP 639 licence expression and
# license-files; an older backend writes the deprecated metadata instead.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlantis-client"
description = "Runtime for the typed Python client tide generates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AtlantisHQ" }]
keywords = ["atlantis", "grpc", "protobuf", "codegen", "database", "typed-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

# The version is read from src/atlantis_client/__init__.py, so __version__ and
# the built metadata cannot disagree.
dynamic = ["version"]

# grpcio is the transport. protobuf's floor is not a preference: generated
# code calls ValidateProtobufRuntimeVersion with the gencode's own version, so
# a runtime older than the plugin that produced the code fails at import.
# 7.36.1 is what buf.build/protocolbuffers/python emits against.
dependencies = [
    "grpcio>=1.60",
    "protobuf>=7.36.1",
]

[project.urls]
Homepage = "https://docs.tryatlantis.dev/"
Documentation = "https://docs.tryatlantis.dev/"

[project.optional-dependencies]
# Both stub packages are required for the type check, not conveniences.
#
# grpcio ships no annotations and grpc.Channel / grpc.ChannelCredentials appear
# in this package's public signatures. protobuf ships neither py.typed nor
# stubs, so google.protobuf.message.Message resolves to Any and every generated
# _pb2.pyi fails `mypy --strict` with "Class cannot subclass Message".
#
# A caller type-checking their own generated tree needs both for the same
# reasons; see guides/use-the-python-client.
#
# types-protobuf trails the runtime it describes: protobuf is 7.36.1 and the
# newest stub release is 7.35.1, so a >=7.36 floor resolves to no candidate.
#
# tomli is the TOML reader for test_version.py on 3.10, which has no tomllib.
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-grpcio>=1.83",
    "types-protobuf>=7.35",
    "tomli>=2; python_version < '3.11'",
]

[tool.hatch.version]
path = "src/atlantis_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlantis_client"]

[tool.hatch.build.targets.sdist]
# The wheel is built from the source distribution, so a path absent here is
# absent from the wheel. py.typed and the .pyi files sit under src.
#
# The tests stay out: they read pyproject.toml and compare an import against
# clients/python/src, neither of which an installed package has.
include = [
    "src/atlantis_client",
    "README.md",
    "LICENSE",
]

# The backend walks up to the version-control root and force-adds the ignore
# file it finds. That is this repository's own /.gitignore — 190 lines naming
# internal paths and secret material — and `include` does not exclude it.
exclude = [".gitignore"]

[tool.mypy]
# No python_version: mypy then follows the interpreter running it, so each
# leg of the CI matrix checks the code as that version sees it.
strict = true
files = ["src/atlantis_client"]

[tool.ruff]
line-length = 100
src = ["src"]
# _wire is buf's output, committed because a wheel carries no proto compiler.
# Fixing its imports or its encoding line puts the tree one regeneration away
# from the same findings, and makes the diff against buf's output unreadable.
# mypy still checks it, and passes: the mypy plugins emit strict-clean stubs.
extend-exclude = ["src/atlantis_client/_wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A run that collects nothing exits 5, so a renamed directory or a broken
# import fails CI rather than reporting success over zero tests. That is
# pytest's own behaviour and needs no flag; --strict-markers is separate, and
# refuses an unregistered marker instead of silently skipping what it guards.
addopts = "--strict-markers"
