# Local dev stack: postgres, memcached, optional atlantis service (profile: isolated).

services:
  postgres:
    # The -oss tag is the Apache-2.0 build. NOT -all, which is the Community
    # (TSL) edition.
    #
    # The Timescale License forbids using TSL software to provide a
    # database-as-a-service, and its "Value Added" exception does not cover
    # atlantis: that exception requires users be prohibited from modifying the
    # database schema via DDL, which is the one thing this product exists to
    # allow. Since atlantis is built to be offered to customers, the Apache
    # build is the only one it can ship on.
    #
    # Nothing is lost. atlantis uses hypertables only — create_hypertable and
    # set_chunk_time_interval, both Apache-2.0 — and -oss still carries vector
    # and postgis. The one omission is timescaledb_toolkit, which nothing here
    # uses and which is TSL.
    #
    # Dev matches production deliberately. Developing against TSL features that
    # cannot be shipped is how a licence dependency arrives unnoticed: someone
    # uses continuous aggregates or compression, it works locally, and it is
    # found at launch. The server reports timescaledb.license at startup, and
    # ATL_REQUIRE_APACHE_TIMESCALE=true makes a Community build refuse to boot.
    image: timescale/timescaledb-ha:pg16-oss
    environment:
      POSTGRES_USER: atlantis
      POSTGRES_PASSWORD: atlantis
      POSTGRES_DB: atlantis
    ports:
      - "5432:5432"
    volumes:
      - atl-pg:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "atlantis"]
      interval: 5s
      timeout: 5s
      retries: 10

  memcached:
    # Upstream memcached for local dev. Production swaps in Grafana's patched fork (not public).
    image: memcached:1.6.29-alpine
    ports:
      - "11211:11211"
    command: ["-m", "256", "-I", "5m", "-v"]

  atlantis:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
    environment:
      PG_URL: postgres://atlantis:atlantis@postgres:5432/atlantis?sslmode=disable
      MEMCACHED_ADDR: memcached:11211
      LOG_LEVEL: debug
      # Apply migrations on boot. Off in production; operators run tidectl migrate-up explicitly.
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: /app/migrations
      # Dev only: allow tide apply to push schema, mirror received .atl to disk.
      # Off in production (schema lands via CI).
      ATL_MIRROR_SCHEMA: "true"
      ATL_MIRROR_DIR: /app/schema
      ATL_ALLOW_APPLY_MUTATION: "true"
    ports:
      - "9090:9090"
    profiles: ["isolated"]

volumes:
  atl-pg:
