# Local dev stack: postgres, memcached, optional atlantis service (profile: isolated).

services:
  postgres:
    # The -oss tag is the Apache-2.0 build. NOT -all, which is the Community
    # (TSL) edition.
    #
    # The Timescale License forbids using TSL software to provide a
    # database-as-a-service, and its "Value Added" exception does not cover
    # atlantis: that exception requires users be prohibited from modifying the
    # database schema via DDL, which is the one thing this product exists to
    # allow. Since atlantis is built to be offered to customers, the Apache
    # build is the only one it can ship on.
    #
    # Nothing is lost. atlantis uses hypertables only — create_hypertable and
    # set_chunk_time_interval, both Apache-2.0 — and -oss still carries vector
    # and postgis. The one omission is timescaledb_toolkit, which nothing here
    # uses and which is TSL.
    #
    # Dev matches production deliberately. Developing against TSL features that
    # cannot be shipped is how a licence dependency arrives unnoticed: someone
    # uses continuous aggregates or compression, it works locally, and it is
    # found at launch. The server reports timescaledb.license at startup, and
    # ATL_REQUIRE_APACHE_TIMESCALE=true makes a Community build refuse to boot.
    #
    # The major version tracks CI (.github/workflows/ci.yml), not the latest
    # release. Developing on one major and testing on another is how a
    # version-dependent behaviour — a plan node, a lock wait, a catalogue
    # column — is found by CI rather than by the person who wrote it. This was
    # pg16 while CI ran pg17, which is exactly that gap.
    image: timescale/timescaledb-ha:pg17-oss
    environment:
      POSTGRES_USER: atlantis
      POSTGRES_PASSWORD: atlantis
      POSTGRES_DB: atlantis
    ports:
      - "5432:5432"
    volumes:
      - atl-pg:/home/postgres/pgdata/data
      # Extensions, once, when the data directory is created. Read
      # pg-initdb/00-extensions.sql for why atlantis cannot install `vector`
      # for itself: its pool registers the pgvector types in AfterConnect, so it
      # cannot open a connection to the database it would run CREATE EXTENSION
      # on.
      #
      # The whole directory, not the one file: Apple's `container` can only
      # bind-mount a directory, and this is the form both runtimes accept.
      - ./deploy/pg-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "atlantis"]
      interval: 5s
      timeout: 5s
      retries: 10

  memcached:
    # Upstream memcached for local dev. Production swaps in Grafana's patched fork (not public).
    image: memcached:1.6.29-alpine
    ports:
      - "11211:11211"
    command: ["-m", "256", "-I", "5m", "-v"]

  # Local CA + server/console leaf certs, into the shared atl-dev-certs volume.
  # Runs to completion, then the atlantis service starts.
  #
  # Not optional. atlantis accepts no plaintext connection: the caller
  # allowlist, the caller-to-cert binding and the capability grants all key off
  # the client certificate's CN, so a listener with no certificate has no
  # identity for any of them to be about.
  #
  # Incremental — a second `up` reuses what is already there.
  certs:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "apk add --no-cache openssl >/dev/null 2>&1 && sh /scripts/init-certs.sh"
    volumes:
      - atl-dev-certs:/certs
      - atl-dev-ca-private:/ca-private
      - ./deploy/init-certs.sh:/scripts/init-certs.sh:ro
    environment:
      CERT_DIR: /certs
      CA_PRIVATE_DIR: /ca-private
    restart: "no"
    profiles: ["isolated"]

  atlantis:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
      certs:
        condition: service_completed_successfully
    volumes:
      - atl-dev-certs:/certs:ro
    environment:
      PG_URL: postgres://atlantis:atlantis@postgres:5432/atlantis?sslmode=disable
      MEMCACHED_ADDR: memcached:11211
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
      TLS_CA_FILE: /certs/ca.crt
      LOG_LEVEL: debug
      # Apply migrations on boot. Off in production; operators run tidectl migrate-up explicitly.
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: /app/migrations
      # Dev only: allow tide apply to push schema, mirror received .atl to disk.
      # Off in production (schema lands via CI).
      ATL_MIRROR_SCHEMA: "true"
      ATL_MIRROR_DIR: /app/schema
      ATL_ALLOW_APPLY_MUTATION: "true"
    ports:
      - "9090:9090"
    profiles: ["isolated"]

volumes:
  atl-pg:
  atl-dev-certs:
  # Separate volume, mounted by the certs service alone. The CA private key
  # never reaches the atlantis container, which needs only its own leaf and the
  # CA certificate.
  atl-dev-ca-private:
