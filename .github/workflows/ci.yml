# atlantis CI.
#
# Gates every PR on: build, vet, lint, unit tests, codegen freshness,
# migration up/down/up safety, and integration tests against ephemeral
# Postgres + memcached. Integration suite needs Docker; we use GitHub
# Actions' built-in Docker runtime via testcontainers-go.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest

    # PostgreSQL for the pg-gated tests.
    #
    # Without it, ATLANTIS_TEST_PG is unset, every _pg_test.go calls t.Skip, and
    # a skip counts as a pass. That is not a small gap: the live proof that
    # `partition by` isolates tenants at all — the hostile-SQL suite, the
    # zero-transaction-ID property, the connect-time clear, the re-appliability
    # of the emitted DDL — ran only when somebody ran it by hand. Three
    # adversarial reviews found defects in that work; none of them could have
    # been caught by CI as it stood.
    #
    # -oss is the Apache-2.0 build, matching the migration-safety job and
    # production. pg17 rather than pg16: every measurement these tests assert
    # was taken on 17.8, and a claim verified on one major version is not
    # evidence about another.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17-oss
        env:
          POSTGRES_USER: atlantis
          POSTGRES_PASSWORD: atlantis
          POSTGRES_DB: atlantis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ATLANTIS_TEST_PG: postgres://atlantis:atlantis@localhost:5432/atlantis?sslmode=disable
      PG_URL: postgres://atlantis:atlantis@localhost:5432/atlantis?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          # buf generate populates clients/go/pb from atlantis/common/v1
          # protos. Without this step internal/runtime/pagination.go
          # fails to compile (gen-less repo — pb output is gitignored).
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: codegen + build
        # `make codegen` runs tidectl + buf generate, then builds every
        # in-scope Go package. Conditionally builds gen/ + cmd/server
        # only when .atl fixtures populated gen/ (this repo ships none
        # by design — callers run codegen against their own schemas).
        run: make codegen

      - name: go vet
        # Skips gen/ — it only exists once codegen has run against caller
        # .atl fixtures, which CI doesn't do. cmd/server used to be skipped
        # for the same reason and no longer needs to be: it imports the
        # runtime IR dispatcher (internal/server/entity), not gen/go/server,
        # so `go list -deps ./cmd/server` names no gen package.
        run: go vet ./cmd/server ./cmd/tide ./cmd/tidectl ./internal/... ./jobs/...

      - name: apply infra migrations
        # The pg-gated tests need atlantis.current_partition() and the rest of
        # the infra schema. Without this they skip on a database that exists,
        # which is the same silent pass as having no database at all.
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          migrate -path ./migrations/infra -database "$PG_URL&x-migrations-table=atlantis_schema_migrations_infra" up

      - name: confirm the database tests are not skipping
        # A skip is a pass, so "the suite is green" says nothing about whether
        # any of this ran.
        #
        # Naming one test was not enough: a review counted 26 files gated on
        # ATLANTIS_TEST_PG, and the two that prove this feature end to end were
        # not among the pinned ones. Both could skip with CI green.
        #
        # So: the fixture must be present, every named test must report PASS,
        # and the whole gated set must record ZERO skips. The last one is what
        # keeps this honest as tests are added — a new pg test that silently
        # skips fails the build instead of being invisible.
        run: |
          set -euo pipefail
          psql "$PG_URL" -tAc "SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname='atlantis' AND p.proname='current_partition'" | grep -q 1

          for spec in \
            "./internal/codegen/:TestPartitionRLSIsolatesTenantsAgainstHostileSQL" \
            "./internal/codegen/:TestPartitionBindConsumesNoTransactionID" \
            "./internal/codegen/:TestPartitionDiscriminatorNeverReturnsEmptyString" \
            "./internal/server/entity/:TestPartitionEndToEnd" \
            "./internal/storage/pg/:TestVerifyPartitionPolicies" \
            "./internal/storage/pg/:TestTenantResetAtConnect" \
            "./internal/runtime/:TestBindPartitionConfinesEverythingInTheTransaction" ; do
            pkg="${spec%%:*}"; test="${spec##*:}"
            echo "== $pkg $test"
            go test "$pkg" -run "^${test}$" -count=1 -v 2>&1 | tee /tmp/pin.txt
            grep -q -- "--- PASS: ${test}" /tmp/pin.txt
          done

          # No test may skip FOR WANT OF THE DATABASE. A skip counts as a pass,
          # so a new pg-gated test that silently skips has to fail the build
          # rather than be invisible.
          #
          # Scoped to the database reason, not to every skip. A blanket
          # `grep -- "--- SKIP:"` was written first and would have failed on
          # every runner from the first push: /schema/ is gitignored with zero
          # tracked files, so the .atl-corpus tests skip on a fresh checkout and
          # not on a dev machine that has the directory. It looked verified
          # locally and could never have passed in CI — and the cheapest repair
          # would have been deleting this check, which is the one part of the
          # database work that keeps CI honest as tests are added.
          go test ./cmd/server ./cmd/tide ./cmd/tidectl ./internal/... ./jobs/... -count=1 -v 2>&1 | tee /tmp/all.txt
          if grep -A2 -- "--- SKIP:" /tmp/all.txt | grep -q "ATLANTIS_TEST_PG"; then
            echo "::error::a test skipped for want of the database, with the database available"
            grep -B1 -A2 -- "--- SKIP:" /tmp/all.txt | grep -B2 "ATLANTIS_TEST_PG"
            exit 1
          fi
          echo "skips for want of the database: none"
          grep -c -- "--- SKIP:" /tmp/all.txt || true

      - name: unit tests with race detector
        # cmd/server carries the source-level tests for things only
        # observable at boot: that built-in jobs are registered and
        # scheduled, and that ATL_REQUIRE_TENANT_ISOLATION is reached and
        # refuses. While this list omitted cmd/server they were written,
        # passing, and never run by CI.
        #
        # -timeout because go's default is 10m PER PACKAGE and
        # internal/runtime/sandbox/conformance takes 643-716s under -race on an
        # M-series laptop across repeated runs — 43 to 116 seconds OVER the
        # default, so on hardware like that it panics with a goroutine dump
        # rather than failing honestly, and the same commit is green or red
        # depending on which runner it lands on. The spread is the point: a
        # package this close to a limit does not fail reproducibly.
        # Raised rather than tuned to the current number, since the suite
        # only grows.
        run: go test -race -timeout=25m ./cmd/server ./cmd/tide ./cmd/tidectl ./internal/... ./jobs/...

      - name: codegen freshness
        # Catches "edited .atl but forgot to regenerate." If make codegen
        # produces different bytes than gen/, fail loudly so the PR author
        # knows to run codegen + commit before merging.
        run: make codegen-check

      - name: integration tests
        # testcontainers-go spins up Postgres against GitHub Actions'
        # Docker. Scoped to tests/integration/backfill/ — the parent
        # tests/integration package (crud_test.go, grpc_test.go) needs
        # gen/go/server, which only exists after running codegen against
        # real caller .atl files. The backfill subpackage is gen-free
        # by design.
        run: go test -tags=integration -timeout=10m ./tests/integration/backfill/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          # Lint typechecks every Go file, including internal/runtime/
          # pagination.go which imports atlantis-go/pb/atlantis/common/v1
          # — that package is generated by buf from atlantis/common/v1
          # protos. Without buf, golangci-lint fails before it lints.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: codegen
        # Populates clients/go/pb/ so the lint step can typecheck the
        # entire module. Same dependency the build+test job needs.
        run: make codegen

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin a v2 release; .golangci.yml uses `version: "2"` which
          # requires golangci-lint v2.x. The previous "latest" pin
          # resolved to a stale v1.64.8 cache (v1 series, built with
          # Go 1.24 — refused to analyse our Go 1.25.0 target).
          version: v2.12.2
          # Explicit package list skips gen/, which only exists once codegen
          # has run against real caller .atl files (this repo ships none by
          # design). Same scoping the go-vet and go-test steps use.
          args: ./cmd/server/... ./cmd/tide/... ./cmd/tidectl/... ./internal/...

  migration-safety:
    name: migrate up/down/up
    runs-on: ubuntu-latest

    services:
      postgres:
        # -oss is the Apache-2.0 build; -all is Community (TSL) and cannot be
        # offered as a hosted service. CI matches production.
        image: timescale/timescaledb-ha:pg16-oss
        env:
          POSTGRES_USER: atlantis
          POSTGRES_PASSWORD: atlantis
          POSTGRES_DB: atlantis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_URL: postgres://atlantis:atlantis@localhost:5432/atlantis?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: migrate-roundtrip
        # up → down → up against a fresh Postgres so a broken .down.sql
        # can't slip through. Exercises every migration in migrations/.
        run: make migrate-roundtrip
