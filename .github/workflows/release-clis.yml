# Release workflow for the atlantis CLIs (tide + tidectl).
#
# Triggers on any `v*` tag push (e.g. `git tag v0.4.0 && git push --tags`).
#
# The two CLIs build differently because only one of them needs cgo.
#
#   tide      — the client end users install. It sends raw .atl bytes to the
#               server and does no local parsing, so it has no cgo dependency
#               and cross-compiles to darwin/{arm64,amd64}, linux/{amd64,arm64},
#               and windows/amd64 from a single runner in seconds.
#
#   tidectl   — the operator CLI. It validates SQL locally through
#               pg_query_go (libpg_query via cgo), so each target needs its own
#               C toolchain. It runs on the server host, so linux/{amd64,arm64}
#               is the whole supported surface: amd64 native on ubuntu-latest,
#               arm64 cross-compiled via gcc-aarch64-linux-gnu — both on free
#               amd64 runners for public and private repos.
#
# Install:
#   curl -sSL https://github.com/<org>/atlantis/releases/download/$VERSION/tide-$VERSION-darwin-arm64.tar.gz \
#     | tar -xz --strip-components=1 -C /usr/local/bin tide-*-darwin-arm64/tide
# or from source (needs a C toolchain only if you want `tide sandbox`):
#   go install github.com/<org>/atlantis/cmd/tide@v0.4.0

name: release-clis

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create / attach to the GH release

jobs:
  build-tide:
    name: build tide (all platforms)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto Go code from atlantis/common/v1
        # internal/runtime/pagination.go imports
        # github.com/rachitkumar205/atlantis/clients/go/pb/atlantis/common/v1,
        # which resolves via go.mod's `replace` to ./clients/go.
        # That directory is gitignored (derived output); regenerate it
        # before the build. buf.gen.yaml uses local plugins; install them
        # before buf runs.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf generate

      - name: Build tide tarballs for every platform
        # Pure-Go cross-compile: no CC, no matrix, no cross-toolchain.
        run: make release-tide VERSION=${{ github.ref_name }}

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: tide-all-platforms
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-tidectl:
    name: build tidectl ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runs-on: ubuntu-latest, cc: "" }
          - { os: linux, arch: arm64, runs-on: ubuntu-latest, cc: aarch64-linux-gnu-gcc, apt-cross: gcc-aarch64-linux-gnu }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto Go code from atlantis/common/v1
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf generate

      - name: Install cross-toolchain (${{ matrix.apt-cross }})
        if: matrix.apt-cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-cross }}

      - name: Build tidectl tarball (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
        run: make release-clis-native VERSION=${{ github.ref_name }}

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: tidectl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: attach to GitHub Release
    needs: [build-tide, build-tidectl]
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        # Sorted by filename (second column) so the file is byte-identical
        # across re-runs of the same VERSION + tree state — downstream
        # installers that pin the sum don't churn.
        run: |
          cd dist
          shasum -a 256 *.tar.gz | sort -k 2 > SHA256SUMS
          ls -la

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # softprops auto-creates the release if it doesn't already exist
          # for this tag, so the same workflow handles both first-tag and
          # republish-with-amended-binaries flows.
          files: |
            dist/tide-*.tar.gz
            dist/tidectl-*.tar.gz
            dist/SHA256SUMS
          # Keep the release body whatever was set manually (or blank);
          # release notes are written deliberately on the GitHub Release
          # page when cutting a tag — not auto-generated here.
          generate_release_notes: false
          fail_on_unmatched_files: true
