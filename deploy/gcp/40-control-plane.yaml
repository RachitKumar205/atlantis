# Cloud, the console and the provisioner, in atlantis-system.
#
# The Deployments are the ones deploy/k8s-dev.sh runs locally, with three
# differences: images come from Artifact Registry, the HTTP Services are
# ClusterIP with container-native endpoints for the Ingress (50-traffic.yaml),
# and the console's enrolment listener has its own passthrough load balancer,
# because it terminates TLS itself and reads client certificates on /renew.
#
# Placeholders, filled by 40-control-plane.sh:
#   __CLOUD_IMAGE__ __CONSOLE_IMAGE__ __PROVISIONER_IMAGE__
#   __SERVER_IMAGE__ __SIGNER_IMAGE__ __PG_IMAGE__
#   __DOMAIN__      the product domain: platform. (Cloud), console., enroll., and <org>. per organisation
#   __POD_CIDR__    the cluster's pod range
#   __ENROLL_IP__   the reserved address for enroll.__DOMAIN__
#   __MAIL_DEV__    "false" with a Resend key, "true" for the logging mailer
#   __MAIL_FROM__   the sender address
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: atlantis-cloud
  namespace: atlantis-system
spec:
  healthCheck:
    type: HTTP
    port: 9500
    requestPath: /healthz
---
apiVersion: v1
kind: Service
metadata:
  name: atlantis-cloud
  namespace: atlantis-system
  labels:
    app.kubernetes.io/name: atlantis-cloud
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "atlantis-cloud"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlantis-cloud
  ports:
    - name: http
      port: 9500
      targetPort: 9500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlantis-cloud
  namespace: atlantis-system
  labels:
    app.kubernetes.io/name: atlantis-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis-cloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis-cloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      terminationGracePeriodSeconds: 40
      containers:
        - name: cloud
          image: __CLOUD_IMAGE__
          args: ["serve", "-key", "/keys/signing-key.pem", "-listen", ":9500"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          envFrom:
            - secretRef:
                name: atlantis-cloud
          env:
            - name: CLOUD_ISSUER
              value: "https://platform.__DOMAIN__"
            - name: CLOUD_PUBLIC_URL
              value: "https://platform.__DOMAIN__"
            - name: CLOUD_COOKIE_SECURE
              value: "true"
            # Behind the Google load balancer, which sets X-Forwarded-For.
            - name: CLOUD_TRUST_PROXY
              value: "true"
            - name: CLOUD_MAIL_DEV
              value: "__MAIL_DEV__"
            - name: CLOUD_MAIL_FROM
              value: "__MAIL_FROM__"
          ports:
            - name: http
              containerPort: 9500
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9500
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9500
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: keys
          secret:
            secretName: atlantis-cloud
            items:
              - key: signing-key.pem
                path: signing-key.pem
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: atlantis-console
  namespace: atlantis-system
spec:
  healthCheck:
    type: HTTP
    port: 3000
    requestPath: /
---
apiVersion: v1
kind: Service
metadata:
  name: atlantis-console
  namespace: atlantis-system
  labels:
    app.kubernetes.io/name: atlantis-console
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "atlantis-console"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlantis-console
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# The enrolment listener: a passthrough TCP load balancer on a reserved
# address. Nothing in front of it terminates TLS.
apiVersion: v1
kind: Service
metadata:
  name: atlantis-console-enroll
  namespace: atlantis-system
  labels:
    app.kubernetes.io/name: atlantis-console
spec:
  type: LoadBalancer
  loadBalancerIP: __ENROLL_IP__
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: atlantis-console
  ports:
    - name: enroll
      port: 443
      targetPort: 3443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlantis-console
  namespace: atlantis-system
  labels:
    app.kubernetes.io/name: atlantis-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis-console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      terminationGracePeriodSeconds: 40
      containers:
        - name: console
          image: __CONSOLE_IMAGE__
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          envFrom:
            - secretRef:
                name: atlantis-console
          env:
            - name: CLOUD_ISSUER
              value: "https://platform.__DOMAIN__"
            - name: CLOUD_AUDIENCE
              value: "https://console.__DOMAIN__"
            # Keys are fetched in-cluster; the issuer string is what a browser used.
            - name: CLOUD_JWKS_URL
              value: "http://atlantis-cloud.atlantis-system.svc.cluster.local:9500/.well-known/jwks.json"
            - name: CONSOLE_COOKIE_SECURE
              value: "true"
            - name: CONSOLE_ENROLL_LISTEN
              value: ":3443"
            - name: CONSOLE_ENROLL_TLS_CERT
              value: "/enroll/enroll-server.crt"
            - name: CONSOLE_ENROLL_TLS_KEY
              value: "/enroll/enroll-server.key"
            - name: CONSOLE_ENROLL_PUBLIC_URL
              value: "https://enroll.__DOMAIN__"
          ports:
            - name: http
              containerPort: 3000
            - name: enroll
              containerPort: 3443
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: enroll
              mountPath: /enroll
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Issued by cert-manager (50-traffic.yaml). The pod waits for it.
        - name: enroll
          secret:
            secretName: atlantis-console-enroll
            items:
              - key: tls.crt
                path: enroll-server.crt
              - key: tls.key
                path: enroll-server.key
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlantis-provisioner
  namespace: atlantis-system
  labels:
    app.kubernetes.io/name: atlantis-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis-provisioner
    spec:
      serviceAccountName: atlantis-provisioner
      # The one pod that calls the Kubernetes API.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      containers:
        - name: provisioner
          image: __PROVISIONER_IMAGE__
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          envFrom:
            - secretRef:
                name: atlantis-provisioner
          env:
            - name: CLOUD_AUDIENCE
              value: "https://console.__DOMAIN__"
            # Every organisation gets <org>.__DOMAIN__; a wildcard record sends
            # them all to the tenant load balancer.
            - name: PROVISIONER_ORG_DOMAIN
              value: "__DOMAIN__"
            - name: PROVISIONER_ENROLL_URL
              value: "https://enroll.__DOMAIN__"
            - name: PROVISIONER_CONSOLE_IN_CLUSTER
              value: "true"
            - name: PROVISIONER_SERVER_IMAGE
              value: "__SERVER_IMAGE__"
            - name: PROVISIONER_SIGNER_IMAGE
              value: "__SIGNER_IMAGE__"
            - name: PROVISIONER_POSTGRES_IMAGE
              value: "__PG_IMAGE__"
            - name: PROVISIONER_MEMCACHED_ADDR
              value: "memcached.atlantis-system.svc.cluster.local:11211"
            - name: PROVISIONER_STORAGE_CLASS
              value: "pd-csi"
            - name: PROVISIONER_POSTGRES_STORAGE
              value: "10Gi"
            # The range every tenant NetworkPolicy excludes. A mismatch with the
            # cluster fails open.
            - name: PROVISIONER_POD_CIDR
              value: "__POD_CIDR__"
            - name: PROVISIONER_PULL_POLICY
              value: "IfNotPresent"
          ports:
            - name: health
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
