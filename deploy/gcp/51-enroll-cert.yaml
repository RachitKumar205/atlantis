# The enrolment listener's certificate: Let's Encrypt through cert-manager,
# proven by DNS-01 at Cloudflare, where the domain's zone is. The token lives
# in the cert-manager namespace as Secret cloudflare-api-token, written by
# 50-traffic.sh from Secret Manager.
#
# Placeholders, filled by 50-traffic.sh: __DOMAIN__ __ACME_EMAIL__
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: atlantis-console-enroll
  namespace: atlantis-system
spec:
  secretName: atlantis-console-enroll
  dnsNames:
    - enroll.__DOMAIN__
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
