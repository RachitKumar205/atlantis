<!doctype html>
<!--
  data-theme="light" pins the sign-in app to the light theme rather than
  following the operating system. The artwork beside the form is a daylight
  scene, and it does not have a dark counterpart: on a dark ground the picture
  keeps its own sky and the panel next to it goes black, which reads as two
  pages joined down the middle.

  This is the whole opt-out. datum.css applies dark only when neither <html>
  nor the scope element carries data-theme="light".
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlantis Cloud</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      No <style> block here, and no font <link>.

      Both would break the Content-Security-Policy this app is served under
      (spaCSP, internal/cloud/server/server.go):

        - A <style> block is Vite's one inline-style path, and `style-src 'self'`
          has no 'unsafe-inline'.
        - A <link> to fonts.googleapis.com is a third-party request from the
          page where passwords are typed. Geist is self-hosted instead, declared
          with @font-face in src/styles/fonts.css.

      Neither failure shows up in `vite dev`, which never applies the policy.
    -->
  </head>
  <!--
    `datum` scopes the palette in web/shared/datum.css, which is being adopted
    one surface at a time. On the body rather than on the shell so the ground
    covers overscroll: .shell is min-height 100%, and #root has auto height, so
    that percentage does not resolve and the old ground would show through
    underneath.

    A class attribute, not a style attribute — style-src 'self' rejects the
    latter.
  -->
  <body class="datum">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
