<!doctype html>
<!--
  data-theme="light" pins the console to the light theme rather than following
  the operating system, matching the Cloud sign-in app. Without it a machine set
  to dark showed Cloud light and the console dark, and a session crosses between
  the two every time somebody signs in or switches organisation.

  This is the whole opt-out. datum.css applies dark only when neither <html> nor
  the scope element carries data-theme="light".
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>atlantis console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      No font <link>. The three families are self-hosted from this origin and
      declared in src/styles/fonts.css, the same four files Cloud serves.
    -->
  </head>
  <!--
    `datum` scopes the palette in web/shared/datum.css. The console and the
    Cloud sign-in app both carry it, so both read from the same tokens; anything
    still on Bathysphere is whatever does not have this class.
  -->
  <body class="datum">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
