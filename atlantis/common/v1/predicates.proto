// Shared predicate messages. Entity codegen embeds these in QueryXFilter;
// the runtime translator (internal/codegen/query/translator.go) walks the
// set oneof arm to build the SQL fragment.
//
// New `op` arms must take the next free number; reuse a number only after
// the old arm has a 'reserved' line.

edition = "2023";

package atlantis.common.v1;

option features.field_presence = IMPLICIT;

import "google/protobuf/timestamp.proto";

// StringPredicate covers text / varchar / citext / uuid.
//
// prefix, suffix, contains and ilike take a literal, not a LIKE pattern:
// `%`, `_` and `\` in the value are escaped before the comparison.
message StringPredicate {
  oneof op {
    string eq = 1;
    string neq = 2;
    StringList in = 3;
    StringList not_in = 4;
    // The column starts with the value.
    string prefix = 5;
    // The column ends with the value.
    string suffix = 6;
    // The column contains the value.
    string contains = 7;
    // The column contains the value, compared without case.
    string ilike = 8;
    bool is_null = 9;
    bool is_not_null = 10;
  }
}

// Int32Predicate handles smallint + int. `between` is inclusive;
// lo > hi is rejected (likely caller bug).
message Int32Predicate {
  oneof op {
    int32 eq = 1;
    int32 neq = 2;
    int32 lt = 3;
    int32 lte = 4;
    int32 gt = 5;
    int32 gte = 6;
    Int32List in = 7;
    Int32List not_in = 8;
    Int32Range between = 9;
    bool is_null = 10;
    bool is_not_null = 11;
  }
}

message Int64Predicate {
  oneof op {
    int64 eq = 1;
    int64 neq = 2;
    int64 lt = 3;
    int64 lte = 4;
    int64 gt = 5;
    int64 gte = 6;
    Int64List in = 7;
    Int64List not_in = 8;
    Int64Range between = 9;
    bool is_null = 10;
    bool is_not_null = 11;
  }
}

message BoolPredicate {
  oneof op {
    bool eq = 1;
    bool is_null = 2;
    bool is_not_null = 3;
  }
}

// TimestampPredicate uses google.protobuf.Timestamp. `between` is inclusive.
// Out-of-range timestamps are rejected by the proto codec.
message TimestampPredicate {
  oneof op {
    google.protobuf.Timestamp eq = 1;
    google.protobuf.Timestamp neq = 2;
    google.protobuf.Timestamp lt = 3;
    google.protobuf.Timestamp lte = 4;
    google.protobuf.Timestamp gt = 5;
    google.protobuf.Timestamp gte = 6;
    TimestampRange between = 7;
    bool is_null = 8;
    bool is_not_null = 9;
  }
}

// BytesPredicate covers bytea and (for now) jsonb. JSONB equality is
// byte-for-byte against PG's normalized rendering; value-level JSON
// predicates are not supported yet.
message BytesPredicate {
  oneof op {
    bytes eq = 1;
    bytes neq = 2;
    BytesList in = 3;
    bool is_null = 4;
    bool is_not_null = 5;
  }
}

// NumericPredicate carries numeric/decimal columns as decimal strings;
// the translator casts to PG numeric on both sides of the comparison.
message NumericPredicate {
  oneof op {
    string eq = 1;
    string neq = 2;
    string lt = 3;
    string lte = 4;
    string gt = 5;
    string gte = 6;
    StringList in = 7;
    bool is_null = 8;
    bool is_not_null = 9;
  }
}

// FloatPredicate covers `real` (PG float4); DoublePredicate covers `double`
// (float8). Two messages rather than one, and the arm width is the point.
//
// # Why the widths are kept apart
//
// float8 is a strict superset of float4, so a single double-carrying message
// would be expressive enough. It would also sit on the wrong side of a real
// hazard: PG promotes a float4 column to float8 to compare it against a float8
// value, and a row storing 0.1 in a `real` column promotes to
// 0.10000000149011612. `WHERE score = 0.1::float8` therefore returns nothing
// while the value plainly reads back as 0.1 — measured, not reasoned.
//
// Carrying the caller's value at the column's own width keeps the comparison
// inside float4. The SQL side casts the placeholder to match (see
// translateFloatPredicate), and pgx independently negotiates the parameter type
// with PG, so today all three agree and any one would do. The width being
// stated in the message is the half a CALLER can see: a client library reading
// this proto binds a float32 for a float4 column without having to know what
// the server does with it.
//
// # What this does NOT fix
//
// Float equality is still float equality. `eq` on a value that was computed
// rather than round-tripped from the same literal can miss, on either width.
// The arms exist because a caller who knows their data expects them, not
// because they are safe in general.
//
// # Ordering is float8, deliberately
//
// ORDER BY and the keyset cursor compare a `real` column after promotion to
// float8, because the page token carries the promoted value (see
// runtime.EncodePageToken). Filtering therefore compares at float4 and ordering
// at float8. For `double` the two coincide; for `real` they can disagree at the
// boundary, and a PG test pins that a filtered page still returns every matching
// row exactly once.
message FloatPredicate {
  oneof op {
    float eq = 1;
    float neq = 2;
    float lt = 3;
    float lte = 4;
    float gt = 5;
    float gte = 6;
    FloatList in = 7;
    bool is_null = 8;
    bool is_not_null = 9;
  }
}

message DoublePredicate {
  oneof op {
    double eq = 1;
    double neq = 2;
    double lt = 3;
    double lte = 4;
    double gt = 5;
    double gte = 6;
    DoubleList in = 7;
    bool is_null = 8;
    bool is_not_null = 9;
  }
}

message StringList {
  repeated string values = 1;
}

message Int32List {
  repeated int32 values = 1;
}

message Int64List {
  repeated int64 values = 1;
}

message BytesList {
  repeated bytes values = 1;
}

message FloatList {
  repeated float values = 1;
}

message DoubleList {
  repeated double values = 1;
}

message Int32Range {
  int32 lo = 1;
  int32 hi = 2;
}

message Int64Range {
  int64 lo = 1;
  int64 hi = 2;
}

message TimestampRange {
  google.protobuf.Timestamp lo = 1;
  google.protobuf.Timestamp hi = 2;
}
