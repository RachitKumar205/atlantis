// PageToken is an opaque keyset cursor returned in QueryXResponse and
// echoed back unchanged. The embedded entity_id prevents using a
// cursor from one entity against another.

edition = "2023";

package atlantis.common.v1;

option features.field_presence = IMPLICIT;

import "google/protobuf/timestamp.proto";

// PageToken carries the ORDER BY values + PK tiebreaker of the last
// row of a page. entity_id is "<namespace>.<EntityName>"; the decoder
// rejects cursors whose entity_id doesn't match the current request.
message PageToken {
  string entity_id = 1;
  repeated PageTokenValue values = 2;
}

// One value per ORDER BY column plus PK tiebreaker. Numeric is sent
// as decimal string (gRPC has no arbitrary-precision decimal).
message PageTokenValue {
  oneof v {
    string s = 1;
    int64 i = 2;
    bool b = 3;
    google.protobuf.Timestamp ts = 4;
    bytes raw = 5;
    string num = 6;
    // A NULL ordering key.
    //
    // The ARM's presence is the whole signal; the bool carries nothing and
    // is always true. It cannot be expressed by omitting the value instead:
    // a PageToken holds one entry per ORDER BY column positionally, so a
    // missing entry would shift every later column onto the wrong one.
    //
    // A distinct arm is also what keeps NULL distinguishable from a real
    // zero. Before this existed, an unset optional scalar reached the cursor
    // as 0 or "" and the encoder could not tell the two apart, so a page
    // boundary landing on a NULL was written as a value that compares
    // in-range — which is how rows past it became unreachable.
    bool null = 7;
  }
}
