// The envelope wrapper for the framed WorkerDispatch stream.
//
// WorkerDispatch carries JSON envelopes over a codec this repository
// registers itself, `atl-json-dispatch`, selected by the gRPC content-subtype.
// grpc-go forces that subtype with CallContentSubtype; grpc-python cannot —
// measured against a live server, it sends `content-type: application/grpc`
// with no subtype, call metadata does not override it, and no knob for it
// exists in the Python layer or in cygrpc. The server then decodes with the
// default proto codec and the stream fails on the first envelope.
//
// So a second service carries the identical JSON envelopes inside a protobuf
// message, over the default codec, for clients that cannot choose one. The
// bytes inside are byte-for-byte what the unframed stream carries; only the
// wrapper differs, and both services run the same session logic.

edition = "2023";

package atlantis.workerdispatch.v1;

option features.field_presence = IMPLICIT;

// Frame wraps one JSON envelope.
//
// A WorkerEnvelope going up, a DispatchEnvelope coming down — the same tagged
// unions the unframed stream sends, encoded by the same json.Marshal. This
// message never inspects them; it is a length-delimited byte carrier and
// nothing else, which is what keeps the two services from drifting apart on
// envelope shape.
message Frame {
  bytes json = 1;
}
