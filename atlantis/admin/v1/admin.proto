// The Admin service: the control surface `tide`, `tidectl`, and the console
// all speak. It was hand-rolled over a JSON codec for its first year, which
// meant every RPC existed in four hand-maintained copies (server descriptor,
// two CLI clients, console BFF) with no schema anyone could check them
// against. This file is that schema.
//
// Two translation choices are load-bearing:
//
// Opaque JSON payloads (IR snapshots, schema diffs, job args, workflow state)
// are `bytes`, not google.protobuf.Struct. They must round-trip byte-exact:
// plan ids and checkpoint addresses are content hashes over the IR JSON, and
// schema_versions.diff is stored as JSONB. Struct would reorder keys and
// renormalize numbers, silently changing hashes.
//
// Timestamps that Go models as time.Time become google.protobuf.Timestamp.
// The many *_at fields typed `string` in Go are RFC3339 text the server
// formats itself; those stay `string` so their wire bytes do not move.

syntax = "proto3";

package atlantis.admin.v1;

import "atlantis/admin/v1/capability.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Service
//
// Every method declares the capability it requires. This is enforced twice: a
// single interceptor checks the caller's grants against the declaration on each
// request, and startup walks this descriptor and refuses to boot if any method
// is left UNSPECIFIED. No handler performs its own authorization.
// ---------------------------------------------------------------------------

service AdminService {
  // Schema lifecycle.

  // Read-only against the database, but it discloses cross-caller impact and
  // live drift, so it requires more than SCHEMA_READ.
  rpc PlanSchema(PlanSchemaRequest) returns (PlanSchemaResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_PLAN;
  }
  rpc ApplyMigration(ApplyMigrationRequest) returns (ApplyMigrationResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_APPLY;
  }
  rpc GetMergedSchema(GetMergedSchemaRequest) returns (GetMergedSchemaResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc GetCanonicalIR(GetCanonicalIRRequest) returns (GetCanonicalIRResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc GetCallerFiles(GetCallerFilesRequest) returns (GetCallerFilesResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  // Rewrites the shared checkpoint from an existing database, affecting every
  // caller — an operator action, not a caller one.
  rpc AdoptBaseline(AdoptBaselineRequest) returns (AdoptBaselineResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }

  // Backfill.

  rpc BeginBackfillPlan(BeginBackfillPlanRequest) returns (BeginBackfillPlanResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_APPLY;
  }
  rpc GetBackfillStatus(GetBackfillStatusRequest) returns (GetBackfillStatusResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }

  // Declarative jobs.

  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse) {
    option (required_capability) = CAPABILITY_JOBS_WRITE;
  }
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse) {
    option (required_capability) = CAPABILITY_JOBS_READ;
  }
  rpc ListDeadJobs(ListDeadJobsRequest) returns (ListDeadJobsResponse) {
    option (required_capability) = CAPABILITY_JOBS_READ;
  }
  rpc RetryDeadJob(RetryDeadJobRequest) returns (RetryDeadJobResponse) {
    option (required_capability) = CAPABILITY_JOBS_WRITE;
  }

  // Workflows.

  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse) {
    option (required_capability) = CAPABILITY_JOBS_WRITE;
  }
  rpc GetWorkflowStatus(GetWorkflowStatusRequest) returns (GetWorkflowStatusResponse) {
    option (required_capability) = CAPABILITY_JOBS_READ;
  }

  // Schema history and lineage.

  rpc GetSchemaHistory(GetSchemaHistoryRequest) returns (GetSchemaHistoryResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc GetSchemaVersion(GetSchemaVersionRequest) returns (GetSchemaVersionResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc DiffSchemaVersions(DiffSchemaVersionsRequest) returns (DiffSchemaVersionsResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc GetEntityLineage(GetEntityLineageRequest) returns (GetEntityLineageResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc GetEntityOwners(GetEntityOwnersRequest) returns (GetEntityOwnersResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  // Objects a destructive migration parked instead of dropping. Read-only:
  // changing a retention window is a deliberate act with data consequences,
  // and it stays a documented UPDATE rather than a one-click button.
  rpc ListParkedObjects(ListParkedObjectsRequest) returns (ListParkedObjectsResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }

  // Which plan classes may apply without a human. Read is SCHEMA_READ because
  // a caller about to apply should be able to see the ceiling it will meet;
  // write is a capability of its own, held by no identity that can apply.
  rpc GetChangePolicy(GetChangePolicyRequest) returns (GetChangePolicyResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc SetChangePolicy(SetChangePolicyRequest) returns (SetChangePolicyResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_APPROVE;
  }

  // Changes waiting on a human, and the decisions about them.
  //
  // Reading is SCHEMA_READ: a change queued for approval is not a secret from
  // the engineers whose deploys it blocks. Deciding is SCHEMA_APPROVE, which no
  // identity that can apply holds.
  rpc ListSchemaPlans(ListSchemaPlansRequest) returns (ListSchemaPlansResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc GetSchemaPlan(GetSchemaPlanRequest) returns (GetSchemaPlanResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc ApproveSchemaPlan(ApproveSchemaPlanRequest) returns (ApproveSchemaPlanResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_APPROVE;
  }
  rpc RejectSchemaPlan(RejectSchemaPlanRequest) returns (RejectSchemaPlanResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_APPROVE;
  }

  // Reverts the shared checkpoint for every caller in one transaction.
  rpc RollbackSchema(RollbackSchemaRequest) returns (RollbackSchemaResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }
  // Read-only preview of the above; discloses the same cross-caller impact a
  // plan does.
  rpc PreviewRollback(PreviewRollbackRequest) returns (PreviewRollbackResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_PLAN;
  }

  // Caller identity. Every mutation here changes who may talk to the server at
  // all, so all of them are operator-only.

  rpc GetCallers(GetCallersRequest) returns (GetCallersResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  rpc RegisterCaller(RegisterCallerRequest) returns (RegisterCallerResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }
  rpc RevokeCaller(RevokeCallerRequest) returns (RevokeCallerResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }
  rpc RecordCallerCertExpiry(RecordCallerCertExpiryRequest) returns (RecordCallerCertExpiryResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }
  rpc GetCallerAliases(GetCallerAliasesRequest) returns (GetCallerAliasesResponse) {
    option (required_capability) = CAPABILITY_SCHEMA_READ;
  }
  // Aliases decide which callers can see one another's entities.
  rpc SetCallerAliases(SetCallerAliasesRequest) returns (SetCallerAliasesResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }

  // Observability.

  // Not SCHEMA_READ: the log ring carries driver error text that can include
  // row values. See the note on CAPABILITY_LOGS_READ.
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse) {
    option (required_capability) = CAPABILITY_LOGS_READ;
  }

  // Worker dispatcher.

  rpc ListConnectedWorkers(ListConnectedWorkersRequest) returns (ListConnectedWorkersResponse) {
    option (required_capability) = CAPABILITY_WORKERS_READ;
  }
  rpc GetWorkerSession(GetWorkerSessionRequest) returns (GetWorkerSessionResponse) {
    option (required_capability) = CAPABILITY_WORKERS_READ;
  }
  // Drain and evict terminate work in flight on another process.
  rpc DrainWorker(DrainWorkerRequest) returns (DrainWorkerResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }
  rpc EvictWorker(EvictWorkerRequest) returns (EvictWorkerResponse) {
    option (required_capability) = CAPABILITY_OPERATOR;
  }
}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// PlanClass is the routing decision for a proposed schema change. It is the
// entire caller-side mental model:
//
//   additive          applies unattended
//   backfill_required needs backfill SQL declared on the affected fields
//   destructive        removes something that can hold rows
//   cross_caller_breaking  changes something another caller reads
//   unparseable       the DSL or its custom SQL did not compile
//
// destructive and cross_caller_breaking are decided by the deployment's change
// policy, not by this enum: the server holds a per-class rule for whether a
// human must approve and which role may do it. The class says what KIND of
// change this is; the policy says what happens to it.
enum PlanClass {
  PLAN_CLASS_UNSPECIFIED = 0;
  PLAN_CLASS_ADDITIVE = 1;
  PLAN_CLASS_BACKFILL_REQUIRED = 2;
  PLAN_CLASS_CROSS_CALLER_BREAKING = 3;
  PLAN_CLASS_UNPARSEABLE = 4;

  // Appended, never renumbered. 4 is UNPARSEABLE and stays there: renumbering
  // silently changes meaning for any client that has not been rebuilt, which
  // during a rolling deploy is every client for a while.
  //
  // Its absence is why a destructive plan reached the CLI as UNPARSEABLE and
  // printed "custom-query SQL validation failed" with no errors listed —
  // naming a subsystem that was not involved, for a change that had parsed
  // perfectly well.
  PLAN_CLASS_DESTRUCTIVE = 5;
}

// SubmittedFile is one .atl source file as shipped by a caller. Content is
// raw bytes: the client never parses, the server does all lowering.
message SubmittedFile {
  string path = 1;
  bytes content = 2;
}

// CallerSubmission groups one caller's files, for multi-caller adopt.
message CallerSubmission {
  string caller = 1;
  repeated SubmittedFile files = 2;
}

// ImpactEntry describes how one caller is affected by a plan, including the
// plan's own caller.
message ImpactEntry {
  string caller = 1;
  bool affected = 2;
  string detail = 3;
}

message CustomDeclCount {
  int32 queries = 1;
  int32 procedures = 2;
}

// ExtensionStatus reports one required Postgres extension. Action is one of
// "ok" (already enabled), "enable" (atlantis will CREATE EXTENSION inside the
// apply transaction), or "missing" (an operator must install it at the OS
// level first — apply refuses until then).
message ExtensionStatus {
  string name = 1;
  string trigger = 2;
  string action = 3;
  string install_hint = 4;
}

// ---------------------------------------------------------------------------
// Drift
//
// Three independent checks compare the declared schema against the live
// database. Each blocks apply unless its escape hatch is set, because each
// represents a constraint the database enforces that the schema does not know
// about — the shape of bug that silently rejects legitimate writes.
// ---------------------------------------------------------------------------

message UniqueIndexDrift {
  string entity_id = 1;
  string schema = 2;
  string table = 3;
  string index_name = 4;
  repeated string columns = 5;
  // Partial marks a `... WHERE <pred>` index. It is drift unless a
  // `unique index partial` on the same columns declares an equivalent
  // predicate: a full-uniqueness declaration does not cover it, because a
  // partial unique is semantically weaker.
  bool partial = 6;
  string predicate = 7;
}

enum CheckDriftKind {
  CHECK_DRIFT_KIND_UNSPECIFIED = 0;
  // The .atl declares a CHECK the live table does not enforce.
  CHECK_DRIFT_KIND_DECLARED_NOT_ENFORCED = 1;
  // The live table enforces a CHECK the .atl does not declare.
  CHECK_DRIFT_KIND_LIVE_NOT_DECLARED = 2;
}

message CheckConstraintDrift {
  CheckDriftKind kind = 1;
  string entity_id = 2;
  string schema = 3;
  string table = 4;
  // Live constraint name; empty for a declared-only check, where the
  // temp-table name carries no meaning.
  string constraint_name = 5;
  // Verbatim .atl check expression.
  string declared = 6;
  // Postgres-normalized `CHECK (...)` deparse — either the declared check's
  // normalized form or the live constraint's definition.
  string definition = 7;
}

message ColumnTypeDrift {
  string entity_id = 1;
  string schema = 2;
  string table = 3;
  string column = 4;
  // Both are Postgres format_type deparses, e.g. "character varying(255)".
  string declared = 5;
  string live = 6;
}

// ---------------------------------------------------------------------------
// Schema lifecycle
// ---------------------------------------------------------------------------

message PlanSchemaRequest {
  string caller = 1;
  repeated SubmittedFile files = 2;
}

message PlanSchemaResponse {
  string plan_id = 1;
  PlanClass class = 2;
  string up_sql = 3;
  string down_sql = 4;
  repeated ImpactEntry impact_report = 5;
  repeated string parse_errors = 6;
  repeated string breaking_detail = 7;

  // Compare-and-swap token, returned in ApplyMigrationRequest so the server
  // can refuse an apply whose ground moved after the plan was made.
  //
  // It covers the part of the checkpoint this caller depends on — its own
  // schema, what it reads from other callers, and whatever this apply will
  // emit DDL for — and not the whole checkpoint. The field name predates
  // that: it did carry the checkpoint's own content hash, which meant any
  // caller's apply invalidated every other caller's plan. Renaming it would
  // break every deployed tide for a word.
  string checkpoint_hash = 8;

  // pg_query_go validation failures for query/procedure blocks.
  repeated string custom_sql_errors = 9;

  CustomDeclCount custom_count = 10;

  // Phase-split outputs for `tide apply --backfill`; empty for other plans.
  // backfill_fields drives the chunked-UPDATE worker, one entry per field,
  // with the user expression and PK column already resolved against the new IR.
  string pre_backfill_up_sql = 11;
  string pre_backfill_indexes_sql = 12;
  string post_backfill_up_sql = 13;
  string post_backfill_indexes_sql = 14;
  repeated BackfillFieldRef backfill_fields = 15;

  // Extensions the new IR requires. Empty when the schema needs none.
  repeated ExtensionStatus extensions = 16;

  // Drift is reported as a plan-time warning here and enforced at apply.
  // The *_error fields carry a message when a check could not run at all,
  // which must not be read as "no drift found".
  repeated UniqueIndexDrift index_drift = 17;
  repeated string index_drift_notes = 18;
  string index_drift_error = 19;

  repeated CheckConstraintDrift check_drift = 20;
  repeated string check_drift_notes = 21;
  string check_drift_error = 22;

  // What the deployment's change policy says about this plan's class.
  //
  // Reported by the server rather than derived by the client from the class,
  // and that is not a convenience: the rule is a row in a table the client
  // cannot read, and a CLI that guessed would print one answer while the apply
  // enforced another. The same reasoning put the destructive gate in the
  // handler instead of `tide apply`'s switch statement.
  //
  // requires_approval is advisory in this release — nothing enforces it yet.
  // It is reported first so an operator sees the rule they are about to be
  // held to before it starts refusing anything.
  bool requires_approval = 26;
  // The console role that may approve, when one is required. Empty otherwise.
  string approver_role = 27;

  repeated ColumnTypeDrift column_drift = 23;
  repeated string column_drift_notes = 24;
  string column_drift_error = 25;
}

message ApplyMigrationRequest {
  string caller = 1;
  string plan_id = 2;
  repeated SubmittedFile files = 3;
  // CAS token from PlanSchemaResponse. Empty skips the check, which is what
  // the first apply into an empty database sends.
  string checkpoint_hash = 4;
}

message ApplyMigrationResponse {
  string applied_at = 1;
  int64 version = 2;
  string content_hash = 3;
}

// ChangePolicyEntry is one deployment's rule for one class of change.
//
// change_class is a PlanClass rather than free text so the set is closed and a
// client cannot invent a rule for a class that does not exist. Note the enum
// carries two values no rule can apply to: UNSPECIFIED, and UNPARSEABLE, which
// means the DSL did not compile and so never reaches an apply at all.
//
// approver_role names a console role. The admin server cannot verify console
// roles — that identity system belongs to the console — so this is what the
// console must present, not something the server checks a human against. It
// lives here rather than in console storage because the decision it qualifies
// is made here.
message ChangePolicyEntry {
  PlanClass change_class = 1;
  bool require_approval = 2;
  string approver_role = 3;
  string updated_at = 4;
  string updated_by = 5;
}

message GetChangePolicyRequest {}

message GetChangePolicyResponse {
  // One entry per class the deployment has a rule for. A class absent here
  // requires approval: the server treats a missing rule and an unrecognized
  // one the same way, so a typo cannot widen anything.
  repeated ChangePolicyEntry entries = 1;
}

// SetChangePolicyRequest replaces the rules for the classes it names, and
// leaves every class it does not name alone.
//
// A full replacement was the alternative and is worse here: two operators with
// the settings page open would each send the whole policy, and the second save
// would silently revert the first one's edit to an unrelated class.
message SetChangePolicyRequest {
  repeated ChangePolicyEntry entries = 1;
  // Who is making the change, for the audit column. The server records it as
  // given — it has no way to authenticate a console user — so it is evidence,
  // not proof.
  string updated_by = 2;
}

message SetChangePolicyResponse {
  // The policy as it stands after the write, every class included, so a client
  // never has to re-read to render what it just changed.
  repeated ChangePolicyEntry entries = 1;
}

// SchemaPlanSummary is one change waiting on, or already carrying, a decision.
message SchemaPlanSummary {
  string plan_id = 1;
  string caller = 2;
  PlanClass change_class = 3;
  // pending_approval | approved | rejected | applied | superseded.
  string state = 4;
  // The verified cert CN that tried to apply.
  string requested_by = 5;
  string created_at = 6;
  string expires_at = 7;
  string decided_by = 8;
  string decided_by_role = 9;
  string decided_at = 10;
  string decision_reason = 11;

  // The role this class currently requires, resolved from the change policy so
  // a client does not have to join the two itself — and so it sees the rule as
  // it stands now rather than as it stood when the plan was filed.
  string approver_role = 12;

  // Whether the window has closed, evaluated at read time. Reported rather than
  // left to the client to compute, because the server is what will enforce it
  // and two clocks disagreeing about an approval is not a difference anyone
  // wants to debug.
  bool expired = 13;
}

// SchemaPlanDetail is what a reviewer decides on.
message SchemaPlanDetail {
  SchemaPlanSummary summary = 1;

  // The proposed .atl source. A reviewer approves SCHEMA; up_sql is what the
  // emitter makes of it, and approving DDL without sight of the declaration
  // that produced it is a signature, not a review.
  repeated SubmittedFile files = 2;

  bytes diff = 3;
  string up_sql = 4;
  string down_sql = 5;
  string base_checkpoint_hash = 6;
}

message ListSchemaPlansRequest {
  // Empty means every state. Callers wanting the queue pass 'pending_approval'.
  string state = 1;
  string caller = 2;
  int32 limit = 3;
}

message ListSchemaPlansResponse {
  repeated SchemaPlanSummary plans = 1;
}

message GetSchemaPlanRequest {
  string plan_id = 1;
}

message GetSchemaPlanResponse {
  SchemaPlanDetail plan = 1;
}

// ApproveSchemaPlanRequest carries who is deciding and what role they hold.
//
// The server cannot authenticate a console user — that identity system belongs
// to the console — so decided_by is recorded as given. decided_by_role is
// different: the server checks it against the class's approver_role before
// writing anything. It cannot prove the console asserted the role honestly, but
// it can refuse an assertion that does not match the rule, so a middleware
// ordering mistake cannot quietly produce an under-privileged approval.
message ApproveSchemaPlanRequest {
  string plan_id = 1;
  string decided_by = 2;
  string decided_by_role = 3;
  string reason = 4;
}

message ApproveSchemaPlanResponse {
  SchemaPlanSummary plan = 1;
}

message RejectSchemaPlanRequest {
  string plan_id = 1;
  string decided_by = 2;
  string decided_by_role = 3;
  // Reaches the caller in the refusal they get on their next apply, so it is
  // the whole of what they are told about why. Required.
  string reason = 4;
}

message RejectSchemaPlanResponse {
  SchemaPlanSummary plan = 1;
}

message GetMergedSchemaRequest {
  string since_version = 1;
}

message GetMergedSchemaResponse {
  string version = 1;
  repeated SubmittedFile files = 2;
}

message GetCallerFilesRequest {
  string caller = 1;
}

message GetCallerFilesResponse {
  repeated SubmittedFile files = 1;
}

message GetCanonicalIRRequest {}

// GetCanonicalIRResponse carries the canonical IR exactly as stored in the
// checkpoint, proto field numbers included, so a caller generating a typed
// client produces wire-identical messages. content_hash pins the schema
// version that generation ran against.
message GetCanonicalIRResponse {
  bytes ir = 1;
  string content_hash = 2;
}

message AdoptDriftItem {
  string entity_id = 1;
  string field = 2;
  string kind = 3;
  // One of "addition", "removal", "mismatch".
  string severity = 4;
  string detail = 5;
}

message AdoptBaselineRequest {
  repeated CallerSubmission submissions = 1;
  // Single-caller shortcut: a non-empty caller is treated as a one-element
  // submissions list. Ignored when submissions is set.
  string caller = 2;
  repeated SubmittedFile files = 3;
  bool allow_drift = 4;
  string adopted_by = 5;
}

message AdoptBaselineResponse {
  bool checkpoint_written = 1;
  // True when a previous adopt with the same file hash already succeeded.
  bool already_adopted = 2;
  repeated AdoptDriftItem drift = 3;
  repeated string warnings = 4;
}

// ---------------------------------------------------------------------------
// Backfill
// ---------------------------------------------------------------------------

message BackfillFieldRef {
  string entity_id = 1;
  string field = 2;
  string expression = 3;
  string pk_column = 4;
  string table_name = 5;
}

message BackfillFieldStatus {
  string entity_id = 1;
  string field = 2;
  string status = 3;
  int64 rows_processed = 4;
  string last_pk = 5;
  string error_msg = 6;
}

// BeginBackfillPlanRequest carries no SQL. The server recomputes every
// statement from the submitted files: accepting caller-supplied DDL here
// would let any apply-capable credential run arbitrary SQL as the atlantis
// role, which is the whole reason this RPC is shaped the way it is.
message BeginBackfillPlanRequest {
  string caller = 1;
  string plan_id = 2;
  repeated SubmittedFile files = 3;
}

message BeginBackfillPlanResponse {
  string plan_hash = 1;
  bool accepted = 2;
  bool already_running = 3;
  bool already_complete = 4;
  string message = 5;
}

message GetBackfillStatusRequest {
  string plan_hash = 1;
  string latest_for_caller = 2;
}

message GetBackfillStatusResponse {
  string plan_hash = 1;
  string caller = 2;
  string status = 3;
  string error_msg = 4;
  string started_at = 5;
  string completed_at = 6;
  repeated BackfillFieldStatus fields = 7;
}

// ---------------------------------------------------------------------------
// Declarative jobs
// ---------------------------------------------------------------------------

message SubmitJobRequest {
  string job_name = 1;
  bytes args = 2;
  // RFC3339; empty means now.
  string scheduled_at = 3;
  string submitted_by = 4;
}

message SubmitJobResponse {
  string job_id = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message JobStatus {
  string job_id = 1;
  string job_name = 2;
  string queue = 3;
  bytes args = 4;
  string status = 5;
  int32 attempts = 6;
  int32 max_retries = 7;
  string last_error = 8;
  string last_error_at = 9;
  string scheduled_for = 10;
  string started_at = 11;
  string completed_at = 12;
  string enqueued_at = 13;
  string submitted_by = 14;
  // progress_pct is -1 when the handler has never checkpointed, so the wire
  // shape distinguishes "0% done" from "uninstrumented".
  int32 progress_pct = 15;
  string progress_msg = 16;
  string progress_at = 17;
}

message GetJobStatusResponse {
  bool found = 1;
  JobStatus job = 2;
}

message ListDeadJobsRequest {
  string job_name = 1;
  int32 limit = 2;
}

message ListDeadJobsResponse {
  repeated JobStatus jobs = 1;
}

// ParkedObject is one entry in the register of objects a destructive migration
// renamed out of the way instead of dropping.
message ParkedObject {
  int64 id = 1;
  // "table" or "column".
  string kind = 2;
  // Where the object lives NOW. For a table this is the tombstone schema; for
  // a column it is the live schema, because a column cannot move.
  string schema_name = 3;
  string object_name = 4;
  // The table holding it, for a column. Empty for a parked table.
  string parent_table = 5;
  // Where it came from, which for a table is not schema_name. This is what a
  // restore puts it back to.
  string original_schema = 6;
  string original_name = 7;
  string parked_at = 8;
  // The instant the reaper may drop it. Fixed when the object was parked, so
  // changing the retention setting never shortens a window already promised.
  string reap_after = 9;
  // Set once the object has actually been dropped. A row with this set is an
  // audit record, not something recoverable.
  string reaped_at = 10;
  // Failed reap attempts, why, and when the next one is allowed. Non-zero
  // attempts almost always mean something was created that depends on the
  // parked object; the reaper declines rather than cascading.
  int32 attempts = 11;
  string last_error = 12;
  string next_attempt_after = 13;
}

message ListParkedObjectsRequest {
  // Include rows already reaped. Off by default: the common question is "what
  // can I still get back", and the audit rows accumulate forever.
  bool include_reaped = 1;
  // Rows per category. Clamped server-side — reaped rows are retained
  // indefinitely, so an unbounded limit is a request to serialize the whole
  // audit history into one message.
  int32 limit = 2;
}

message ListParkedObjectsResponse {
  repeated ParkedObject objects = 1;
  // True when either category was truncated, so a caller can tell "nothing
  // else is parked" from "the page stops here". Without it a list whose whole
  // purpose is "what can I still get back" silently omits rows.
  bool has_more = 2;
}

message RetryDeadJobRequest {
  string job_id = 1;
}

message RetryDeadJobResponse {
  string job_id = 1;
}

// ---------------------------------------------------------------------------
// Workflows
// ---------------------------------------------------------------------------

message StartWorkflowRequest {
  string workflow_name = 1;
  bytes state = 2;
  string submitted_by = 3;
}

message StartWorkflowResponse {
  string workflow_id = 1;
}

message GetWorkflowStatusRequest {
  string workflow_id = 1;
}

message WorkflowStatus {
  string workflow_id = 1;
  string workflow_name = 2;
  string status = 3;
  string current_step = 4;
  string started_at = 5;
  string completed_at = 6;
  string error_msg = 7;
  string submitted_by = 8;
}

message GetWorkflowStatusResponse {
  bool found = 1;
  WorkflowStatus workflow = 2;
}

// ---------------------------------------------------------------------------
// Schema history and lineage
// ---------------------------------------------------------------------------

message GetSchemaHistoryRequest {
  int32 limit = 1;
  int64 before = 2;
  string caller = 3;
}

message SchemaVersionSummary {
  int64 version = 1;
  string caller = 2;
  string plan_class = 3;
  string event_type = 4;
  int32 change_count = 5;
  string created_at = 6;
  // sha256 of the IR snapshot; a git-style content address.
  string ir_hash = 7;
}

message GetSchemaHistoryResponse {
  repeated SchemaVersionSummary versions = 1;
  bool has_more = 2;
}

message GetSchemaVersionRequest {
  int64 version = 1;
}

message GetSchemaVersionResponse {
  int64 version = 1;
  string caller = 2;
  string plan_class = 3;
  string event_type = 4;
  bytes diff = 5;
  string up_sql = 6;
  string down_sql = 7;
  bytes ir_snapshot = 8;
  string created_at = 9;
  // Absent for the root version, which has no parent.
  optional int64 parent_version = 10;
  string ir_hash = 11;
}

message DiffSchemaVersionsRequest {
  int64 from_version = 1;
  int64 to_version = 2;
}

message DiffSchemaVersionsResponse {
  int64 from_version = 1;
  int64 to_version = 2;
  bytes diff = 3;
  bytes from_ir = 4;
  bytes to_ir = 5;
}

message GetEntityLineageRequest {
  string entity_id = 1;
}

message EntityLineageEntry {
  string entity_id = 1;
  string field_name = 2;
  string introduced_by = 3;
  int64 introduced_at = 4;
  string last_modified_by = 5;
  int64 last_modified_at = 6;
  // Absent while the field is still present in the schema.
  optional int64 removed_at = 7;
}

message GetEntityLineageResponse {
  repeated EntityLineageEntry entries = 1;
}

message GetEntityOwnersRequest {}

message EntityOwnerEntry {
  string entity_id = 1;
  string introduced_by = 2;
  int64 introduced_at = 3;
  int32 field_count = 4;
}

message GetEntityOwnersResponse {
  repeated EntityOwnerEntry owners = 1;
}

message RollbackSchemaRequest {
  int64 to_version = 1;
  string caller = 2;
}

message RollbackSchemaResponse {
  int64 new_version = 1;
  string up_sql = 2;
}

message PreviewRollbackRequest {
  int64 to_version = 1;
}

message PreviewRollbackResponse {
  int64 target_version = 1;
  int64 current_version = 2;
  // SQL that would run on execute.
  string up_sql = 3;
  string plan_class = 4;
  int32 change_count = 5;
}

// ---------------------------------------------------------------------------
// Caller identity
// ---------------------------------------------------------------------------

message CallerInfo {
  string caller = 1;
  int32 file_count = 2;
  // RFC3339; empty if never applied.
  string last_applied_at = 3;
  int64 schema_version = 4;
  bool registered = 5;
  bool can_mutate = 6;
  // RFC3339; empty when no cert was issued through the console.
  string cert_expires_at = 7;
}

message GetCallersRequest {}

message GetCallersResponse {
  repeated CallerInfo callers = 1;
}

message RegisterCallerRequest {
  string caller = 1;
  bool can_mutate = 2;
  // Operator email, recorded for audit.
  string created_by = 3;
}

message RegisterCallerResponse {
  string caller = 1;
  bool can_mutate = 2;
}

message RevokeCallerRequest {
  string caller = 1;
}

message RevokeCallerResponse {
  int32 files_removed = 1;
}

message RecordCallerCertExpiryRequest {
  string caller = 1;
  // RFC3339. Required.
  string expires_at = 2;
  // Hex-encoded SHA-256 of the signed leaf cert's DER bytes. Once set, every
  // authenticated RPC from this caller must present a cert whose fingerprint
  // matches — that is how rotation and revocation invalidate prior certs
  // without a CRL.
  string fingerprint = 3;
}

message RecordCallerCertExpiryResponse {
  string caller = 1;
  string expires_at = 2;
}

message GetCallerAliasesRequest {
  string caller = 1;
}

message GetCallerAliasesResponse {
  string caller = 1;
  repeated string aliases = 2;
}

message SetCallerAliasesRequest {
  string caller = 1;
  repeated string aliases = 2;
}

message SetCallerAliasesResponse {
  string caller = 1;
  repeated string aliases = 2;
}

// ---------------------------------------------------------------------------
// Observability
// ---------------------------------------------------------------------------

message GetLogsRequest {
  uint64 since = 1;
  // Caps records returned, applied after the since-cursor filter. Zero means
  // no extra cap; the response is still bounded by the ring's capacity.
  int32 limit = 2;
}

message LogEntry {
  uint64 seq = 1;
  string time = 2;
  string level = 3;
  string msg = 4;
  map<string, string> attrs = 5;
}

message GetLogsResponse {
  repeated LogEntry records = 1;
  uint64 last_seq = 2;
}

// ---------------------------------------------------------------------------
// Worker dispatcher
// ---------------------------------------------------------------------------

message DispatcherSessionSnapshot {
  string session_id = 1;
  string caller = 2;
  string queue = 3;
  string pod_id = 4;
  string sdk_version = 5;
  google.protobuf.Timestamp connected_at = 6;
  google.protobuf.Timestamp last_heartbeat_at = 7;
  int32 max_in_flight = 8;
  int32 inflight_count = 9;
  int64 dispatched = 10;
  int64 completed = 11;
  int64 failed = 12;
  int64 revoked = 13;
  bool drained = 14;
}

message DispatcherInflightDetail {
  int64 job_id = 1;
  string job_name = 2;
  google.protobuf.Timestamp dispatched_at = 3;
  bool ack_received = 4;
}

message DispatcherEventSnapshot {
  google.protobuf.Timestamp at = 1;
  string kind = 2;
  int64 job_id = 3;
  string job_name = 4;
  string note = 5;
}

message DispatcherSessionDetail {
  DispatcherSessionSnapshot snapshot = 1;
  repeated string job_names = 2;
  repeated DispatcherInflightDetail inflight = 3;
  repeated DispatcherEventSnapshot events = 4;
}

message ListConnectedWorkersRequest {}

message ListConnectedWorkersResponse {
  repeated DispatcherSessionSnapshot sessions = 1;
}

message GetWorkerSessionRequest {
  string session_id = 1;
}

message GetWorkerSessionResponse {
  DispatcherSessionDetail session = 1;
}

message DrainWorkerRequest {
  string session_id = 1;
}

message DrainWorkerResponse {}

message EvictWorkerRequest {
  string session_id = 1;
}

message EvictWorkerResponse {}
