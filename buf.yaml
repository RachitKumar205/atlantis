# buf module. Name is reserved for future BSR push; works locally without an account.
version: v2
modules:
  - path: .
    name: buf.build/rachitkumar205/atlantis
    excludes:
      - gen
      - tests
      # Golden output for TestEmittersMatchGolden. These are the .proto files
      # the emitter produced for a fixture schema, checked in so a change to
      # any emitter shows up as a reviewable diff — they are expected VALUES,
      # not part of this module. buf would try to compile them and fail on the
      # cross-file references they carry (author.proto imports book.proto,
      # which resolves only inside a caller's generated tree).
      - internal/codegen/testdata/golden
lint:
  use:
    - STANDARD
breaking:
  use:
    - WIRE_JSON
